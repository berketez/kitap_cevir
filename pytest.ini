[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Proje kokundeki script dosyalarini test olarak toplama
norecursedirs = scripts output venv .git __pycache__ data

# Default kosuda integration testleri skip etmek icin:
#   pytest -m "not integration"
# Integration testleri calistirmak icin:
#   pytest -m integration
# Gerçek Ollama / LM Studio / GGUF modeli yükleyen testler (yerel_model) de
# varsayılan koşuda seçilmez; kullanıcı onayıyla: pytest -m yerel_model
addopts = -m "not integration and not yerel_model"

markers =
    integration: Gercek HY-MT 7B modelli entegrasyon testleri (yavas, opt-in)
    yerel_model: gerçek Ollama/LM Studio/GGUF modeli yükleyen testler (opt-in, kullanıcı onayıyla)
    sahte_sunucu: sahte HTTP sunucusu (tests/fakes/fake_llm_server.py) kullanan test

# Ucuncu taraf kaynakli warning'leri sustur (kendi kodumuzda olan degil)
filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
